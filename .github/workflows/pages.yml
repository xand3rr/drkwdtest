name: Build and test minimal CMS base
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: minimal-cms-base
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the plain page and OAuth protocol
        run: npm test
      - name: Build without npm dependencies
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-cms-base
          path: _site
